name: build

on:
  push:
    branches:
    - main
    paths-ignore:
    - '**/*.md'
    - '**/*.png'
  pull_request:
    branches:
    - main
    paths-ignore:
    - '**/*.md'
    - '**/*.png'
    types: [opened, synchronize, reopened] # https://docs.github.com/en/free-pro-team@latest/actions/reference/events-that-trigger-workflows#pull_request
  workflow_dispatch:
    inputs:
      reason:
        description: 'The reason for running the workflow.'
        required: true
        default: 'Manual run'

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  SOLUTION_FILE: ProxiedHosts.slnx

jobs:
  build:
    name: Build - ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
          - name: Linux
            os: ubuntu-latest
          - name: macOS
            os: macos-latest

    runs-on: ${{ matrix.os }}

    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    steps:
      - uses: actions/checkout@v7
        with:
          # Disabling shallow clone is recommended for improving relevancy.
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # Opted to use this instead of cache=true in setup-dotnet for simpler setup.
      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', 'Directory.Build.props') }}
          restore-keys: ${{ runner.os }}-nuget

      - name: Cache SonarCloud packages
        if: matrix.os == 'ubuntu-latest' && env.SONAR_TOKEN != ''
        uses: actions/cache@v6
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Install SonarScanner
        if: matrix.os == 'ubuntu-latest' && env.SONAR_TOKEN != ''
        run: dotnet tool install --global dotnet-sonarscanner

      - name: Restore
        run: dotnet restore "${{ env.SOLUTION_FILE }}"

      - name: Begin SonarCloud analysis
        if: matrix.os == 'ubuntu-latest' && env.SONAR_TOKEN != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # Needed to get PR information, if any.
        shell: bash
        run: |
          dotnet sonarscanner begin \
            /k:"StevenJDH_ProxiedHosts" \
            /o:"stevenjdh" \
            /d:sonar.token="$SONAR_TOKEN" \
            /d:sonar.host.url="https://sonarcloud.io" \
            /d:sonar.scanner.scanAll=false \
            /d:sonar.coverage.exclusions="**/*.*"

      - name: Build
        run: >
          dotnet build "${{ env.SOLUTION_FILE }}"
          --configuration Debug
          --no-restore

      - name: End SonarCloud analysis
        if: matrix.os == 'ubuntu-latest' && env.SONAR_TOKEN != ''
        shell: bash
        run: dotnet sonarscanner end /d:sonar.token="$SONAR_TOKEN"