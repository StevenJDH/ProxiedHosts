name: release

on:
  workflow_dispatch:
    inputs:
      prerelease:
        description: 'Mark this release as a prerelease.'
        required: true
        default: false
        type: boolean
      version:
        description: 'Optional version override, e.g. 1.0.0.26101. Leave blank to use the project file.'
        required: false
        default: ''
        type: string
      release_notes_file:
        description: 'Optional release notes file override. Leave blank to use .github/release-notes/<version>.md if present.'
        default: ''
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  PROJECT_FILE: ProxiedHosts.Console/ProxiedHosts.Console.csproj
  APP_NAME: proxiedhosts
  TRAY_PROJECT_FILE: ProxiedHosts.Tray/ProxiedHosts.Tray.csproj
  TRAY_APP_NAME: proxiedhosts-tray
  MACOS_APP_NAME: ProxiedHosts
  MACOS_BUNDLE_ID: io.github.stevenjdh.proxiedhosts
  MACOS_ICON_FILE: ProxiedHosts.Tray/Assets/ProxiedHosts.icns

jobs:
  # ------------------------------------------------------------
  # Validate and normalize the requested version.
  # ------------------------------------------------------------
  prepare:
    name: Prepare release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      package_version: ${{ steps.version.outputs.package_version }}
      assembly_version: ${{ steps.version.outputs.assembly_version }}
      file_version: ${{ steps.version.outputs.file_version }}
      tag: ${{ steps.version.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Resolve version
        id: version
        shell: bash
        env:
          VERSION_OVERRIDE: ${{ inputs.version }}
        run: |
          set -euo pipefail

          PROJECT_VERSION="$(dotnet msbuild "${PROJECT_FILE}" -nologo -getProperty:Version)"
          PROJECT_ASSEMBLY_VERSION="$(dotnet msbuild "${PROJECT_FILE}" -nologo -getProperty:AssemblyVersion)"
          PROJECT_FILE_VERSION="$(dotnet msbuild "${PROJECT_FILE}" -nologo -getProperty:FileVersion)"

          VERSION_OVERRIDE="${VERSION_OVERRIDE#v}"

          if [[ -n "${VERSION_OVERRIDE//[[:space:]]/}" ]]; then

            if [[ ! "$VERSION_OVERRIDE" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
              echo "::error::Invalid version '$VERSION_OVERRIDE'. Expected format such as 1.0.0.26101."
              exit 1
            fi

            MAJOR="${BASH_REMATCH[1]}"
            MINOR="${BASH_REMATCH[2]}"
            PATCH="${BASH_REMATCH[3]}"

            PACKAGE_VERSION="${MAJOR}.${MINOR}.${PATCH}"
            ASSEMBLY_VERSION="$VERSION_OVERRIDE"
            FILE_VERSION="$VERSION_OVERRIDE"
            RELEASE_VERSION="$VERSION_OVERRIDE"

            echo "Using workflow version override."
          else
            if [[ ! "$PROJECT_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Project Version '$PROJECT_VERSION' must have the format 1.0.0."
              exit 1
            fi

            if [[ ! "$PROJECT_ASSEMBLY_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Project AssemblyVersion '$PROJECT_ASSEMBLY_VERSION' must have the format 1.0.0.26101."
              exit 1
            fi

            if [[ ! "$PROJECT_FILE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Project FileVersion '$PROJECT_FILE_VERSION' must have the format 1.0.0.26101."
              exit 1
            fi

            if [[ "$PROJECT_ASSEMBLY_VERSION" != "$PROJECT_FILE_VERSION" ]]; then
              echo "::error::AssemblyVersion and FileVersion do not match."
              exit 1
            fi

            PACKAGE_VERSION="$PROJECT_VERSION"
            ASSEMBLY_VERSION="$PROJECT_ASSEMBLY_VERSION"
            FILE_VERSION="$PROJECT_FILE_VERSION"
            RELEASE_VERSION="$PROJECT_FILE_VERSION"

            echo "Using versions from project file."
          fi

          echo "package_version=$PACKAGE_VERSION" >> "$GITHUB_OUTPUT"
          echo "assembly_version=$ASSEMBLY_VERSION" >> "$GITHUB_OUTPUT"
          echo "file_version=$FILE_VERSION" >> "$GITHUB_OUTPUT"
          echo "version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"

          echo "Package version  : $PACKAGE_VERSION"
          echo "Assembly version : $ASSEMBLY_VERSION"
          echo "File version     : $FILE_VERSION"
          echo "Release version  : $RELEASE_VERSION"
          echo "Tag              : $RELEASE_VERSION"

  # ------------------------------------------------------------
  # Windows + Linux
  #
  # Native runners are used for each CPU architecture.
  # ------------------------------------------------------------
  publish:
    name: AOT - ${{ matrix.rid }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            runner: windows-latest
            os: windows
          - rid: win-arm64
            runner: windows-11-arm
            os: windows
          - rid: linux-x64
            runner: ubuntu-latest
            os: linux
          - rid: linux-arm64
            runner: ubuntu-26.04-arm
            os: linux

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # Opted to use this instead of cache=true in setup-dotnet for simpler setup.
      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', 'Directory.Build.props') }}
          restore-keys: ${{ runner.os }}-nuget

      # Native AOT on Linux requires the native compiler toolchain.
      - name: Install Linux Native AOT prerequisites
        if: matrix.os == 'linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y clang zlib1g-dev

      - name: Publish Native AOT
        run: >
          dotnet publish "${{ env.PROJECT_FILE }}"
          --configuration Release
          --runtime "${{ matrix.rid }}"
          --self-contained true
          -p:PublishAot=true
          -p:Version="${{ needs.prepare.outputs.package_version }}"
          -p:AssemblyVersion="${{ needs.prepare.outputs.assembly_version }}"
          -p:FileVersion="${{ needs.prepare.outputs.file_version }}"
          -o "publish/${{ matrix.rid }}"

      # ----------------------------------------------------------
      # Windows package
      # ----------------------------------------------------------
      - name: Create Windows release package
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          $bundle = "bundle"
          New-Item -ItemType Directory -Force -Path $bundle | Out-Null

          $exe = "publish/${{ matrix.rid }}/${{ env.APP_NAME }}.exe"

          if (-not (Test-Path $exe)) {
              throw "Expected executable was not produced: $exe"
          }

          Copy-Item $exe $bundle

          if (Test-Path "README.md") {
              Copy-Item "README.md" $bundle
          }

          if (Test-Path "LICENSE") {
              Copy-Item "LICENSE" $bundle
          }

          $releaseDir = "release-assets"
          New-Item -ItemType Directory -Force -Path $releaseDir | Out-Null

          $archive = Join-Path `
              $releaseDir `
              "proxiedhosts-${{ needs.prepare.outputs.version }}-${{ matrix.rid }}.zip"

          Compress-Archive `
              -Path "$bundle/*" `
              -DestinationPath $archive

      # ----------------------------------------------------------
      # Linux package
      # ----------------------------------------------------------
      - name: Create Linux release package
        if: matrix.os == 'linux'
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p bundle release-assets

          BINARY="publish/${{ matrix.rid }}/${APP_NAME}"

          if [[ ! -f "$BINARY" ]]; then
            echo "::error::Expected executable was not produced: $BINARY"
            exit 1
          fi

          cp "$BINARY" bundle/
          chmod +x "bundle/${APP_NAME}"

          PROJECT_DIRECTORY="$(dirname "${PROJECT_FILE}")"

          [[ -f README.md ]] && cp README.md bundle/
          [[ -f LICENSE ]] && cp LICENSE bundle/

          tar \
            -C bundle \
            -czf "release-assets/proxiedhosts-${{ needs.prepare.outputs.version }}-${{ matrix.rid }}.tar.gz" \
            .

      - name: Upload release package
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.rid }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 1

  # ------------------------------------------------------------
  # Tray - Windows + Linux
  # ------------------------------------------------------------
  publish-tray:
    name: Tray AOT - ${{ matrix.rid }}
    needs: prepare

    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            runner: windows-latest
            os: windows
          - rid: win-arm64
            runner: windows-11-arm
            os: windows
          - rid: linux-x64
            runner: ubuntu-latest
            os: linux
          - rid: linux-arm64
            runner: ubuntu-26.04-arm
            os: linux

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', 'Directory.Build.props') }}
          restore-keys: ${{ runner.os }}-nuget

      - name: Install Linux Native AOT prerequisites
        if: matrix.os == 'linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y clang zlib1g-dev

      - name: Publish Tray Native AOT
        run: >
          dotnet publish "${{ env.TRAY_PROJECT_FILE }}"
          --configuration Release
          --runtime "${{ matrix.rid }}"
          --self-contained true
          -p:PublishAot=true
          -p:Version="${{ needs.prepare.outputs.package_version }}"
          -p:AssemblyVersion="${{ needs.prepare.outputs.assembly_version }}"
          -p:FileVersion="${{ needs.prepare.outputs.file_version }}"
          -o "publish/tray/${{ matrix.rid }}"

      # ----------------------------------------------------------
      # Windows Tray package
      # ----------------------------------------------------------
      - name: Create Windows Tray release package
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          $bundle = "bundle-tray"
          New-Item -ItemType Directory -Force -Path $bundle | Out-Null

          $publishDirectory = "publish/tray/${{ matrix.rid }}"
          $exe = Join-Path $publishDirectory "${{ env.TRAY_APP_NAME }}.exe"

          if (-not (Test-Path $exe)) {
              throw "Expected executable was not produced: $exe"
          }

          # Avalonia may require additional native files from the
          # publish directory, so package the complete output.
          Copy-Item "$publishDirectory/*" $bundle -Recurse

          if (Test-Path "README.md") {
              Copy-Item "README.md" $bundle
          }

          if (Test-Path "LICENSE") {
              Copy-Item "LICENSE" $bundle
          }

          $releaseDir = "release-assets"
          New-Item -ItemType Directory -Force -Path $releaseDir | Out-Null

          $archive = Join-Path `
              $releaseDir `
              "proxiedhosts-tray-${{ needs.prepare.outputs.version }}-${{ matrix.rid }}.zip"

          Compress-Archive `
              -Path "$bundle/*" `
              -DestinationPath $archive

      # ----------------------------------------------------------
      # Linux Tray package
      # ----------------------------------------------------------
      - name: Create Linux Tray release package
        if: matrix.os == 'linux'
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p bundle-tray release-assets

          PUBLISH_DIRECTORY="publish/tray/${{ matrix.rid }}"
          BINARY="${PUBLISH_DIRECTORY}/${TRAY_APP_NAME}"

          if [[ ! -f "$BINARY" ]]; then
            echo "::error::Expected executable was not produced: $BINARY"
            exit 1
          fi

          cp -a "${PUBLISH_DIRECTORY}/." bundle-tray/
          chmod +x "bundle-tray/${TRAY_APP_NAME}"

          [[ -f README.md ]] && cp README.md bundle-tray/
          [[ -f LICENSE ]] && cp LICENSE bundle-tray/

          tar \
            -C bundle-tray \
            -czf "release-assets/proxiedhosts-tray-${{ needs.prepare.outputs.version }}-${{ matrix.rid }}.tar.gz" \
            .

      - name: Upload Tray release package
        uses: actions/upload-artifact@v7
        with:
          name: release-tray-${{ matrix.rid }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 1

  # ------------------------------------------------------------
  # macOS Universal
  #
  # .NET publishes x64 and arm64 separately. Apple's lipo tool
  # combines the two Mach-O executables into one universal binary.
  # ------------------------------------------------------------
  publish-macos:
    name: AOT - macOS Universal
    needs: prepare
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: macos-nuget-${{ hashFiles('**/*.csproj', 'Directory.Build.props') }}
          restore-keys: macos-nuget

      - name: Publish macOS arm64
        shell: bash
        run: |
          dotnet publish "${PROJECT_FILE}" \
            --configuration Release \
            --runtime osx-arm64 \
            --self-contained true \
            -p:PublishAot=true \
            -p:Version="${{ needs.prepare.outputs.package_version }}" \
            -p:AssemblyVersion="${{ needs.prepare.outputs.assembly_version }}" \
            -p:FileVersion="${{ needs.prepare.outputs.file_version }}" \
            -o publish/osx-arm64

      - name: Publish macOS x64
        shell: bash
        run: |
          dotnet publish "${PROJECT_FILE}" \
            --configuration Release \
            --runtime osx-x64 \
            --self-contained true \
            -p:PublishAot=true \
            -p:Version="${{ needs.prepare.outputs.package_version }}" \
            -p:AssemblyVersion="${{ needs.prepare.outputs.assembly_version }}" \
            -p:FileVersion="${{ needs.prepare.outputs.file_version }}" \
            -o publish/osx-x64

      - name: Create universal macOS binary
        shell: bash
        run: |
          set -euo pipefail

          ARM_BINARY="publish/osx-arm64/${APP_NAME}"
          X64_BINARY="publish/osx-x64/${APP_NAME}"

          if [[ ! -f "$ARM_BINARY" ]]; then
            echo "::error::Missing arm64 binary: $ARM_BINARY"
            exit 1
          fi

          if [[ ! -f "$X64_BINARY" ]]; then
            echo "::error::Missing x64 binary: $X64_BINARY"
            exit 1
          fi

          mkdir -p publish/macos-universal

          lipo \
            -create \
            "$ARM_BINARY" \
            "$X64_BINARY" \
            -output "publish/macos-universal/${APP_NAME}"

          chmod +x "publish/macos-universal/${APP_NAME}"

          # lipo changes the executable, so sign the merged binary again.
          # This is ad-hoc signing, not Developer ID signing.
          codesign \
            --force \
            --sign - \
            "publish/macos-universal/${APP_NAME}"

          echo
          echo "Universal binary architectures:"
          lipo -archs "publish/macos-universal/${APP_NAME}"

      - name: Create macOS release package
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p bundle release-assets

          cp "publish/macos-universal/${APP_NAME}" bundle/
          chmod +x "bundle/${APP_NAME}"

          PROJECT_DIRECTORY="$(dirname "${PROJECT_FILE}")"

          [[ -f README.md ]] && cp README.md bundle/
          [[ -f LICENSE ]] && cp LICENSE bundle/

          tar \
            -C bundle \
            -czf "release-assets/proxiedhosts-${{ needs.prepare.outputs.version }}-macos-universal.tar.gz" \
            .

      - name: Upload macOS release package
        uses: actions/upload-artifact@v7
        with:
          name: release-macos-universal
          path: release-assets/*
          if-no-files-found: error
          retention-days: 1

  # ------------------------------------------------------------
  # Tray - macOS Universal App Bundle
  # ------------------------------------------------------------
  publish-tray-macos:
    name: Tray AOT - macOS Universal
    needs: prepare
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: macos-nuget-${{ hashFiles('**/*.csproj', 'Directory.Build.props') }}
          restore-keys: macos-nuget

      # ----------------------------------------------------------
      # Publish both macOS architectures.
      # ----------------------------------------------------------
      - name: Publish macOS arm64
        shell: bash
        run: |
          dotnet publish "${TRAY_PROJECT_FILE}" \
            --configuration Release \
            --runtime osx-arm64 \
            --self-contained true \
            -p:PublishAot=true \
            -p:UseAppHost=true \
            -p:Version="${{ needs.prepare.outputs.package_version }}" \
            -p:AssemblyVersion="${{ needs.prepare.outputs.assembly_version }}" \
            -p:FileVersion="${{ needs.prepare.outputs.file_version }}" \
            -o publish/tray/osx-arm64

      - name: Publish macOS x64
        shell: bash
        run: |
          dotnet publish "${TRAY_PROJECT_FILE}" \
            --configuration Release \
            --runtime osx-x64 \
            --self-contained true \
            -p:PublishAot=true \
            -p:UseAppHost=true \
            -p:Version="${{ needs.prepare.outputs.package_version }}" \
            -p:AssemblyVersion="${{ needs.prepare.outputs.assembly_version }}" \
            -p:FileVersion="${{ needs.prepare.outputs.file_version }}" \
            -o publish/tray/osx-x64

      # ----------------------------------------------------------
      # Build ProxiedHosts.app and merge all Mach-O files.
      # ----------------------------------------------------------
      - name: Create universal macOS app bundle
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          PACKAGE_VERSION: ${{ needs.prepare.outputs.package_version }}
        run: |
          set -euo pipefail

          ARM_DIR="publish/tray/osx-arm64"
          X64_DIR="publish/tray/osx-x64"

          APP_BUNDLE="bundle/${MACOS_APP_NAME}.app"
          CONTENTS_DIR="${APP_BUNDLE}/Contents"
          MACOS_DIR="${CONTENTS_DIR}/MacOS"
          RESOURCES_DIR="${CONTENTS_DIR}/Resources"

          if [[ ! -f "${ARM_DIR}/${TRAY_APP_NAME}" ]]; then
            echo "::error::Missing arm64 executable: ${ARM_DIR}/${TRAY_APP_NAME}"
            exit 1
          fi

          if [[ ! -f "${X64_DIR}/${TRAY_APP_NAME}" ]]; then
            echo "::error::Missing x64 executable: ${X64_DIR}/${TRAY_APP_NAME}"
            exit 1
          fi

          if [[ ! -f "${MACOS_ICON_FILE}" ]]; then
            echo "::error::Missing macOS icon: ${MACOS_ICON_FILE}"
            exit 1
          fi

          rm -rf bundle
          mkdir -p "${MACOS_DIR}" "${RESOURCES_DIR}"

          # Start with the arm64 publish output. Non-Mach-O resources
          # are architecture-independent and can be copied directly.
          cp -a "${ARM_DIR}/." "${MACOS_DIR}/"

          # Merge every Mach-O file that has arm64/x64 counterparts.
          while IFS= read -r -d '' ARM_FILE; do
            if ! file "${ARM_FILE}" | grep -q "Mach-O"; then
              continue
            fi

            RELATIVE_PATH="${ARM_FILE#${ARM_DIR}/}"
            X64_FILE="${X64_DIR}/${RELATIVE_PATH}"
            OUTPUT_FILE="${MACOS_DIR}/${RELATIVE_PATH}"

            if [[ ! -f "${X64_FILE}" ]]; then
              echo "::error::Missing x64 counterpart for Mach-O file: ${RELATIVE_PATH}"
              exit 1
            fi

            ARM_ARCHS="$(lipo -archs "${ARM_FILE}")"
            X64_ARCHS="$(lipo -archs "${X64_FILE}")"

            # Some dependencies may already be universal.
            if [[ "${ARM_ARCHS}" == *"arm64"* &&
                  "${ARM_ARCHS}" == *"x86_64"* ]]; then
              cp "${ARM_FILE}" "${OUTPUT_FILE}"
              continue
            fi

            if [[ "${X64_ARCHS}" == *"arm64"* &&
                  "${X64_ARCHS}" == *"x86_64"* ]]; then
              cp "${X64_FILE}" "${OUTPUT_FILE}"
              continue
            fi

            if [[ "${ARM_ARCHS}" != *"arm64"* ]]; then
              echo "::error::Expected arm64 architecture in: ${RELATIVE_PATH}"
              exit 1
            fi

            if [[ "${X64_ARCHS}" != *"x86_64"* ]]; then
              echo "::error::Expected x86_64 architecture in: ${RELATIVE_PATH}"
              exit 1
            fi

            lipo \
              -create \
              "${ARM_FILE}" \
              "${X64_FILE}" \
              -output "${OUTPUT_FILE}"
          done < <(find "${ARM_DIR}" -type f -print0)

          chmod +x "${MACOS_DIR}/${TRAY_APP_NAME}"

          cp \
            "${MACOS_ICON_FILE}" \
            "${RESOURCES_DIR}/ProxiedHosts.icns"

          # Your release version is 1.0.0.26101.
          # macOS marketing version is the three-part 1.0.0.
          # Use the fourth component as the macOS build number.
          BUILD_VERSION="${RELEASE_VERSION##*.}"

          cat > "${CONTENTS_DIR}/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
            "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleInfoDictionaryVersion</key>
              <string>6.0</string>

              <key>CFBundlePackageType</key>
              <string>APPL</string>

              <key>CFBundleIdentifier</key>
              <string>${MACOS_BUNDLE_ID}</string>

              <key>CFBundleName</key>
              <string>${MACOS_APP_NAME}</string>

              <key>CFBundleDisplayName</key>
              <string>${MACOS_APP_NAME}</string>

              <key>CFBundleExecutable</key>
              <string>${TRAY_APP_NAME}</string>

              <key>CFBundleIconFile</key>
              <string>ProxiedHosts.icns</string>

              <key>CFBundleShortVersionString</key>
              <string>${PACKAGE_VERSION}</string>

              <key>CFBundleVersion</key>
              <string>${BUILD_VERSION}</string>

              <key>NSHighResolutionCapable</key>
              <true/>

              <key>LSUIElement</key>
              <true/>
          </dict>
          </plist>
          EOF

          plutil -lint "${CONTENTS_DIR}/Info.plist"

      # ----------------------------------------------------------
      # Verify that every Mach-O component is universal.
      # ----------------------------------------------------------
      - name: Verify universal architectures
        shell: bash
        run: |
          set -euo pipefail

          APP_BUNDLE="bundle/${MACOS_APP_NAME}.app"
          FAILED=0
          FOUND=0

          while IFS= read -r -d '' FILE_PATH; do
            if ! file "${FILE_PATH}" | grep -q "Mach-O"; then
              continue
            fi

            FOUND=1
            ARCHS="$(lipo -archs "${FILE_PATH}")"

            echo "${FILE_PATH}: ${ARCHS}"

            if [[ "${ARCHS}" != *"arm64"* ||
                  "${ARCHS}" != *"x86_64"* ]]; then
              echo "::error::Not universal: ${FILE_PATH}"
              FAILED=1
            fi
          done < <(find "${APP_BUNDLE}/Contents/MacOS" -type f -print0)

          if [[ "${FOUND}" -eq 0 ]]; then
            echo "::error::No Mach-O files found in app bundle."
            exit 1
          fi

          if [[ "${FAILED}" -ne 0 ]]; then
            exit 1
          fi

          echo
          echo "Main executable architectures:"
          lipo -archs \
            "${APP_BUNDLE}/Contents/MacOS/${TRAY_APP_NAME}"

      # ----------------------------------------------------------
      # Ad-hoc sign nested native code, then the complete bundle.
      # ----------------------------------------------------------
      - name: Sign macOS app bundle
        shell: bash
        run: |
          set -euo pipefail

          APP_BUNDLE="bundle/${MACOS_APP_NAME}.app"

          while IFS= read -r -d '' FILE_PATH; do
            if file "${FILE_PATH}" | grep -q "Mach-O"; then
              codesign \
                --force \
                --sign - \
                "${FILE_PATH}"
            fi
          done < <(find "${APP_BUNDLE}/Contents/MacOS" -type f -print0)

          codesign \
            --force \
            --sign - \
            "${APP_BUNDLE}"

          codesign \
            --verify \
            --deep \
            --strict \
            --verbose=2 \
            "${APP_BUNDLE}"

      # ----------------------------------------------------------
      # Package the .app for GitHub Releases.
      # ----------------------------------------------------------
      - name: Create macOS Tray release package
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p release-assets

          APP_BUNDLE="bundle/${MACOS_APP_NAME}.app"
          ARCHIVE="release-assets/proxiedhosts-tray-${{ needs.prepare.outputs.version }}-macos-universal.zip"

          ditto \
            -c \
            -k \
            --sequesterRsrc \
            --keepParent \
            "${APP_BUNDLE}" \
            "${ARCHIVE}"

          echo "Created:"
          ls -lh "${ARCHIVE}"

      - name: Upload macOS Tray release package
        uses: actions/upload-artifact@v7
        with:
          name: release-tray-macos-universal
          path: release-assets/*
          if-no-files-found: error
          retention-days: 1

  # ------------------------------------------------------------
  # GitHub Release
  #
  # This only runs after every Native AOT build has completed.
  # ------------------------------------------------------------
  release:
    name: Create GitHub Release

    needs:
      - prepare
      - publish
      - publish-macos
      - publish-tray
      - publish-tray-macos

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download release packages
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Display release packages
        shell: bash
        run: |
          ls -lah dist

      - name: Create SHA256 checksums
        shell: bash
        run: |
          cd dist
          sha256sum proxiedhosts-* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Ensure release does not already exist
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists."
            exit 1
          fi

      - name: Prepare release notes
        id: release_notes
        shell: bash
        env:
          RELEASE_NOTES_OVERRIDE: ${{ inputs.release_notes_file }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail

          DEFAULT_RELEASE_NOTES=".github/release-notes/${RELEASE_VERSION}.md"

          # Explicit workflow input takes precedence.
          if [[ -n "${RELEASE_NOTES_OVERRIDE//[[:space:]]/}" ]]; then
            if [[ ! -f "$RELEASE_NOTES_OVERRIDE" ]]; then
              echo "::error::Release notes override does not exist: $RELEASE_NOTES_OVERRIDE"
              exit 1
            fi

            RELEASE_NOTES_FILE="$RELEASE_NOTES_OVERRIDE"
            echo "Using release notes override: $RELEASE_NOTES_FILE"

          # Otherwise use the conventional release notes file, if present.
          elif [[ -f "$DEFAULT_RELEASE_NOTES" ]]; then
            RELEASE_NOTES_FILE="$DEFAULT_RELEASE_NOTES"
            echo "Using default release notes: $RELEASE_NOTES_FILE"

          # No release notes file is available, so generated notes will be used.
          else
            echo "No release notes file found."
            echo "GitHub-generated release notes will be used."
            echo "provided=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          cp "$RELEASE_NOTES_FILE" release-notes.md

          echo "provided=true" >> "$GITHUB_OUTPUT"

      - name: Create prerelease with custom notes
        if: inputs.prerelease && steps.release_notes.outputs.provided == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          gh release create "$TAG" dist/* \
            --target "${GITHUB_SHA}" \
            --title "$TAG" \
            --notes-file release-notes.md \
            --prerelease \
            --latest=false

      - name: Create prerelease with generated notes
        if: inputs.prerelease && steps.release_notes.outputs.provided != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          gh release create "$TAG" dist/* \
            --target "${GITHUB_SHA}" \
            --title "$TAG" \
            --generate-notes \
            --prerelease \
            --latest=false

      - name: Create stable release with custom notes
        if: ${{ !inputs.prerelease && steps.release_notes.outputs.provided == 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          gh release create "$TAG" dist/* \
            --target "${GITHUB_SHA}" \
            --title "$TAG" \
            --notes-file release-notes.md \
            --latest

      - name: Create stable release with generated notes
        if: ${{ !inputs.prerelease && steps.release_notes.outputs.provided != 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          gh release create "$TAG" dist/* \
            --target "${GITHUB_SHA}" \
            --title "$TAG" \
            --generate-notes \
            --latest